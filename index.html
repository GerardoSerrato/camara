<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Emulación FPGA: Control de Calidad de Monedas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #333;
            width: 100%;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        h1 { margin: 0; font-size: 1.2rem; }
        p { margin: 5px 0 0; font-size: 0.9rem; color: #aaa; }

        #container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Importante para llenar la pantalla */
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Dejar pasar los clics */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El área de inspección "hardcoded" */
        #inspection-zone {
            width: 150px;
            height: 150px;
            border: 4px solid cyan;
            border-radius: 50%;
            box-shadow: 0 0 15px cyan;
        }

        #controls {
            width: 100%;
            padding: 20px;
            background-color: #333;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.5);
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #btn-capture { background-color: #007bff; color: white; }
        #btn-capture:hover { background-color: #0056b3; }

        #btn-reset { background-color: #6c757d; color: white; }
        #btn-reset:hover { background-color: #5a6268; }

        /* Estilo para el estado de error (Rechazo) */
        #container.rejected #inspection-zone {
            border-color: orange;
            box-shadow: 0 0 25px orange;
        }

        #container.rejected canvas {
            filter: sepia(1) saturate(5) hue-rotate(-50deg); /* Filtro naranja */
        }

        #status {
            position: absolute;
            bottom: 80px;
            left: 20px;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        
        .status-idle { background-color: #555; }
        .status-ok { background-color: #28a745; }
        .status-fail { background-color: #dc3545; }

    </style>
</head>
<body>

<header>
    <h1>Emulador FPGA: Inspector de Monedas</h1>
    <p>Coloca la moneda en el círculo</p>
</header>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="overlay">
        <div id="inspection-zone"></div>
    </div>
    
    <div id="status" class="status-idle">ESPERANDO EJEMPLO</div>
</div>

<div id="controls">
    <button id="btn-capture">Capturar Ejemplo</button>
    <button id="btn-reset">Reiniciar</button>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const container = document.getElementById('container');
    const statusDiv = document.getElementById('status');
    const btnCapture = document.getElementById('btn-capture');
    const btnReset = document.getElementById('btn-reset');
    const inspectionZone = document.getElementById('inspection-zone');

    let examplePattern = null;
    let isProcessing = false;
    
    // Umbral de sensibilidad: menor número = más estricto (prueba entre 15 y 30)
    const threshold = 22; 

    async function setupCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            try {
                const fallbackStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                video.srcObject = fallbackStream;
            } catch (fallbackErr) {
                statusDiv.textContent = "ERROR DE CÁMARA";
                statusDiv.className = "status-fail";
            }
        }
    }

    // Calcula el recorte exacto considerando el escalado 'cover'
    function getInspectionZoneData() {
        if (!video.videoWidth || !video.videoHeight) return null;

        const containerRect = container.getBoundingClientRect();
        const zoneRect = inspectionZone.getBoundingClientRect();

        const videoRatio = video.videoWidth / video.videoHeight;
        const containerRatio = containerRect.width / containerRect.height;

        let renderedWidth, renderedHeight, offsetX, offsetY;

        if (containerRatio > videoRatio) {
            renderedWidth = containerRect.width;
            renderedHeight = containerRect.width / videoRatio;
            offsetX = 0;
            offsetY = (renderedHeight - containerRect.height) / 2;
        } else {
            renderedWidth = containerRect.height * videoRatio;
            renderedHeight = containerRect.height;
            offsetX = (renderedWidth - containerRect.width) / 2;
            offsetY = 0;
        }

        const scale = video.videoWidth / renderedWidth;
        const x = (zoneRect.left - containerRect.left + offsetX) * scale;
        const y = (zoneRect.top - containerRect.top + offsetY) * scale;
        const width = zoneRect.width * scale;
        const height = zoneRect.height * scale;

        // Extraer los píxeles de la zona central
        return ctx.getImageData(
            Math.max(0, Math.floor(x)), 
            Math.max(0, Math.floor(y)), 
            Math.floor(width), 
            Math.floor(height)
        );
    }

    // Extrae un vector de características (promedio + desviación de brillo)
    function extractFeatures(imageData) {
        if (!imageData) return null;
        const data = imageData.data;
        let r = 0, g = 0, b = 0, brightnessTotal = 0;
        const totalPixels = data.length / 4;

        for (let i = 0; i < data.length; i += 4) {
            r += data[i];
            g += data[i + 1];
            b += data[i + 2];
            brightnessTotal += (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
        }

        const avgBrightness = brightnessTotal / totalPixels;
        let variance = 0;

        for (let i = 0; i < data.length; i += 4) {
            const pixelBrightness = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
            variance += Math.pow(pixelBrightness - avgBrightness, 2);
        }

        return {
            r: r / totalPixels,
            g: g / totalPixels,
            b: b / totalPixels,
            stdDev: Math.sqrt(variance / totalPixels) // Detecta relieves y texturas
        };
    }

    function captureExample() {
        if (!video.videoWidth) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const zoneData = getInspectionZoneData();
        examplePattern = extractFeatures(zoneData);

        statusDiv.textContent = "EJEMPLO CAPTURADO";
        statusDiv.className = "status-ok";
        btnCapture.textContent = "Recapturar Ejemplo";
    }

    function resetSystem() {
        examplePattern = null;
        statusDiv.textContent = "ESPERANDO EJEMPLO";
        statusDiv.className = "status-idle";
        btnCapture.textContent = "Capturar Ejemplo";
        container.classList.remove('rejected');
    }

    function processFrame() {
        if (isProcessing && video.readyState === video.HAVE_ENOUGH_DATA) {
            if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (examplePattern) {
                const currentData = getInspectionZoneData();
                const currentFeatures = extractFeatures(currentData);

                if (currentFeatures) {
                    const diffR = Math.abs(examplePattern.r - currentFeatures.r);
                    const diffG = Math.abs(examplePattern.g - currentFeatures.g);
                    const diffB = Math.abs(examplePattern.b - currentFeatures.b);
                    const diffTexture = Math.abs(examplePattern.stdDev - currentFeatures.stdDev);

                    // Puntuación combinada de color y textura/relieve
                    const totalError = (diffR + diffG + diffB) / 3 + diffTexture;

                    if (totalError < threshold) {
                        container.classList.remove('rejected');
                        statusDiv.textContent = `OK (Error: ${Math.round(totalError)})`;
                        statusDiv.className = "status-ok";
                    } else {
                        container.classList.add('rejected');
                        statusDiv.textContent = `RECHAZO (Error: ${Math.round(totalError)})`;
                        statusDiv.className = "status-fail";
                    }
                }
            }
        }
        requestAnimationFrame(processFrame);
    }

    video.addEventListener('play', () => {
        isProcessing = true;
        processFrame();
    });

    btnCapture.addEventListener('click', captureExample);
    btnReset.addEventListener('click', resetSystem);

    setupCamera();
</script>
</body>
</html>
